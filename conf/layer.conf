# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-slint-demo"
BBFILE_PATTERN_meta-slint-demo = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-slint-demo = "7"

LAYERDEPENDS_meta-slint-demo = "core ampliphy"
LAYERSERIES_COMPAT_meta-slint-demo = "scarthgap"
